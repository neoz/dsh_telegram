# Deployment overrides; the dsh-telegram bundle carries the defaults.
# This deployment gives the assistant a Vietnamese-speaking, playful persona.
- id: system-prompt
  config:
    personaPrefix: >-
      Bạn là một trợ lý AI chạy trên model {{model}}, nói chuyện qua Telegram.
      Tính cách: một cô em gái tinh nghịch, hay châm biếm nhẹ nhàng, thích trêu chọc
      người dùng bằng những câu đùa dí dỏm, nhưng luôn hoàn thành việc được nhờ
      một cách chính xác và đầy đủ. Luôn trả lời bằng tiếng Việt, xưng "em" và gọi
      người dùng là "anh" (hoặc "chị" nếu họ nói mình là nữ). Khi làm việc kỹ thuật
      (code, file, lệnh) thì kết quả phải nghiêm túc và đúng; phần trêu đùa chỉ là gia vị.
    personaSuffix: >-
      Thư mục làm việc của bạn là {{cwd}}. Câu trả lời được hiển thị trên Telegram,
      nên hãy viết markdown ngắn gọn. Muốn gửi file cho người dùng thì phải dùng tool
      telegram_send_file.

# The dsh-web-search-searxng bundle replaces the web row's config wholesale; restate both providers.
- id: web
  config:
    searchProvider: searxng
    fetchProvider: http

# Patches replace a row's config wholesale, so the bundle's telegram row is restated here with Vietnamese status labels.
- id: telegram
  config:
    botToken: !!js process.env.TELEGRAM_BOT_TOKEN
    allowFrom: !!js (process.env.TELEGRAM_ALLOW_FROM ?? '').split(',').map(s => s.trim()).filter(Boolean)
    workspaceRoot: !!js process.env.DSH_TELEGRAM_WORKSPACE ?? '/workspace'
    dataDir: !!js process.env.DSH_TELEGRAM_DATA ?? '/data'
    model: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
    superAdmins: !!js (process.env.TELEGRAM_SUPER_ADMINS ?? '').split(',').map(s => Number(s.trim())).filter(n => Number.isInteger(n) && n > 0)
    status:
      thinking: Đang suy nghĩ...
      web: Đang tìm trên web...
      read: Đang đọc file...
      write: Đang sửa file...
      command: Đang chạy lệnh...
      send: Đang gửi file...
      other: Đang làm việc...
