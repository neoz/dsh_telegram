services:
  dsh-telegram:
    image: ghcr.io/neoz/dsh-telegram:latest
    # Only what the agent needs is mapped from .env; the rest stays out of the agent process.
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOW_FROM: ${TELEGRAM_ALLOW_FROM}
      TELEGRAM_SUPER_ADMINS: ${TELEGRAM_SUPER_ADMINS}
      TELEGRAM_IDLE_ENABLED: ${TELEGRAM_IDLE_ENABLED:-false}
      TELEGRAM_IDLE_CHATS: ${TELEGRAM_IDLE_CHATS:-}
      DSH_MODEL: ${DSH_MODEL:-deepseek-flash}
      DSH_LOG_LEVEL: ${DSH_LOG_LEVEL:-2}
      DSH_PERMISSION_MODE: danger-full-access
      SEARXNG_URL: http://searxng:8080
      # The agent talks to DeepSeek through llm-proxy, which holds the real key; dsh still
      # insists on a credential, so it gets a placeholder that the proxy replaces.
      DEEPSEEK_BASE_URL: http://llm-proxy:8080/anthropic
      DEEPSEEK_API_KEY: proxy
    volumes:
      - ./workspace:/workspace
      - ./data:/data
      - dsh-home:/dsh-home
    depends_on:
      - searxng
      - llm-proxy
    restart: unless-stopped

  # Self-hosted metasearch behind web_search; not published outside the compose network.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # Pass-through proxy that injects the DeepSeek key; the only service that receives it.
  # Not published outside the compose network.
  llm-proxy:
    image: nginx:alpine
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - ./docker/llm-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped

volumes:
  dsh-home:
