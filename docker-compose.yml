services:
  dsh-telegram:
    image: ghcr.io/neoz/dsh-telegram:latest
    env_file: .env
    environment:
      DSH_PERMISSION_MODE: danger-full-access
      SEARXNG_URL: http://searxng:8080
    volumes:
      - ./workspace:/workspace
      - ./data:/data
      - dsh-home:/dsh-home
    depends_on:
      - searxng
    restart: unless-stopped

  # Self-hosted metasearch behind web_search; not published outside the compose network.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  dsh-home:
